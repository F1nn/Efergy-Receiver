services:
  efergy-receiver:
    # Published automatically to GitHub Container Registry on main and version tags.
    image: ghcr.io/f1nn/efergy-receiver:latest
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    # Keep MQTT discovery identity stable regardless of where the image runs.
    hostname: ${RECEIVER_HOSTNAME:-egergy-receiver}
    env_file:
      - .env
    # os.uname().nodename inside Docker may not reflect the host when using
    # host networking. Explicit ID prevents accidental duplicate discovery.
    environment:
      ENGAGE_RECEIVER_ID: ${RECEIVER_HOSTNAME:-egergy-receiver}
    # USB SDR support; a Proxmox VM must also have the SDR passed through.
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'
    stop_grace_period: 15s
